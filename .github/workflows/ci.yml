name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_DB: fintel_test
          POSTGRES_USER: fintel
          POSTGRES_PASSWORD: fintel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fintel -d fintel_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_NAME: Fintel
      APP_VERSION: 0.1.0
      ENVIRONMENT: development
      DEBUG: "false"
      DATABASE_URL: postgresql+psycopg://fintel:fintel@localhost:5432/fintel_test
      JWT_SECRET_KEY: test-secret
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"
      SEC_USER_AGENT: Fintel CI contact@example.com
      DOCUMENT_STORAGE_PROVIDER: local
      DOCUMENT_STORAGE_PATH: data
      S3_BUCKET_NAME: ""
      S3_KEY_PREFIX: ""
      S3_ENDPOINT_URL: ""
      S3_REGION_NAME: ""
      EMBEDDING_MODEL_NAME: BAAI/bge-small-en-v1.5
      EMBEDDING_DIMENSION: "384"
      EMBEDDING_DEVICE: cpu
      REDIS_URL: redis://localhost:6379/0
      INGESTION_QUEUE_NAME: fintel:ingestion_jobs
      LLM_PROVIDER: extractive
      OPENAI_API_KEY: ""
      OPENAI_BASE_URL: https://api.openai.com/v1
      OPENAI_MODEL: gpt-5-mini
      OPENAI_TIMEOUT_SECONDS: "30"
      RATE_LIMIT_ENABLED: "false"
      RATE_LIMIT_REQUESTS: "120"
      RATE_LIMIT_WINDOW_SECONDS: "60"

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - run: uv sync --frozen

      - run: uv run python -m compileall app tests

      - run: uv run alembic upgrade head

      - run: uv run python -m unittest discover -s tests

  deployment-config:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - run: docker compose config

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.3"

      - run: terraform -chdir=infra/aws init -backend=false

      - run: terraform -chdir=infra/aws validate
