x-app-environment: &app-environment
  APP_NAME: ${APP_NAME:-Fintel}
  APP_VERSION: ${APP_VERSION:-0.1.0}
  ENVIRONMENT: ${ENVIRONMENT:-development}
  DEBUG: ${DEBUG:-false}
  DATABASE_URL: postgresql+psycopg://fintel:${POSTGRES_PASSWORD:-fintel}@postgres:5432/fintel
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me}
  JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
  ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
  SEC_USER_AGENT: ${SEC_USER_AGENT:-Fintel demo contact@example.com}
  DOCUMENT_STORAGE_PROVIDER: ${DOCUMENT_STORAGE_PROVIDER:-local}
  DOCUMENT_STORAGE_PATH: /app/data
  S3_BUCKET_NAME: ${S3_BUCKET_NAME:-}
  S3_KEY_PREFIX: ${S3_KEY_PREFIX:-}
  S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
  S3_REGION_NAME: ${S3_REGION_NAME:-}
  EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME:-BAAI/bge-small-en-v1.5}
  EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-384}
  EMBEDDING_DEVICE: ${EMBEDDING_DEVICE:-cpu}
  REDIS_URL: redis://redis:6379/0
  INGESTION_QUEUE_NAME: ${INGESTION_QUEUE_NAME:-fintel:ingestion_jobs}
  LLM_PROVIDER: ${LLM_PROVIDER:-extractive}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
  OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5-mini}
  OPENAI_TIMEOUT_SECONDS: ${OPENAI_TIMEOUT_SECONDS:-30}
  RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
  RATE_LIMIT_REQUESTS: ${RATE_LIMIT_REQUESTS:-120}
  RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}

services:
  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment: *app-environment
    volumes:
      - filing-data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    command: python -m app.workers.ingestion
    environment: *app-environment
    volumes:
      - filing-data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_DB: fintel
      POSTGRES_USER: fintel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fintel}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fintel -d fintel"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  filing-data:
