services:
  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      APP_NAME: Fintel
      APP_VERSION: 0.1.0
      ENVIRONMENT: development
      DEBUG: "false"
      DATABASE_URL: postgresql+psycopg://fintel:fintel@postgres:5432/fintel
      JWT_SECRET_KEY: change-me
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"
      SEC_USER_AGENT: Fintel demo contact@example.com
      DOCUMENT_STORAGE_PATH: /app/data
      EMBEDDING_MODEL_NAME: BAAI/bge-small-en-v1.5
      EMBEDDING_DIMENSION: "384"
      EMBEDDING_DEVICE: cpu
      REDIS_URL: redis://redis:6379/0
      INGESTION_QUEUE_NAME: fintel:ingestion_jobs
      LLM_PROVIDER: extractive
      OPENAI_API_KEY: ""
      OPENAI_BASE_URL: https://api.openai.com/v1
      OPENAI_MODEL: gpt-5-mini
      OPENAI_TIMEOUT_SECONDS: "30"
    volumes:
      - filing-data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    command: python -m app.workers.ingestion
    environment:
      APP_NAME: Fintel
      APP_VERSION: 0.1.0
      ENVIRONMENT: development
      DEBUG: "false"
      DATABASE_URL: postgresql+psycopg://fintel:fintel@postgres:5432/fintel
      JWT_SECRET_KEY: change-me
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"
      SEC_USER_AGENT: Fintel demo contact@example.com
      DOCUMENT_STORAGE_PATH: /app/data
      EMBEDDING_MODEL_NAME: BAAI/bge-small-en-v1.5
      EMBEDDING_DIMENSION: "384"
      EMBEDDING_DEVICE: cpu
      REDIS_URL: redis://redis:6379/0
      INGESTION_QUEUE_NAME: fintel:ingestion_jobs
      LLM_PROVIDER: extractive
      OPENAI_API_KEY: ""
      OPENAI_BASE_URL: https://api.openai.com/v1
      OPENAI_MODEL: gpt-5-mini
      OPENAI_TIMEOUT_SECONDS: "30"
    volumes:
      - filing-data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_DB: fintel
      POSTGRES_USER: fintel
      POSTGRES_PASSWORD: fintel
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fintel -d fintel"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  filing-data:
